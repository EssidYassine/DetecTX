# DeTecTX — Fluent Bit (chemin production).
# Lit les journaux d'événements Windows et les envoie vers OpenSearch.
# Installer Fluent Bit sur l'HÔTE Windows (pas dans un conteneur : il lui faut
# l'accès au journal d'événements). Lancer en tant que service.
#
#   fluent-bit.exe -c fluent-bit.conf
#
# NOTE : les noms de champs produits par le plugin winlog varient selon la
# version. Le filtre "modify" ci-dessous les aligne sur le schéma DeTecTX
# (channel, event_id, provider, computer, record_id, message, level).
# Vérifier une première fois avec la sortie "stdout" avant OpenSearch.

[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name         winlog
    Channels     Security,System,Application,Microsoft-Windows-Sysmon/Operational,Microsoft-Windows-PowerShell/Operational
    Interval_Sec 5
    Tag          winevt

[FILTER]
    Name         modify
    Match        winevt
    Rename       Channel      channel
    Rename       EventID      event_id
    Rename       ProviderName provider
    Rename       ComputerName computer
    Rename       RecordNumber record_id
    Rename       Message      message
    Rename       Level        level

[OUTPUT]
    Name            opensearch
    Match           winevt
    Host            127.0.0.1
    Port            9200
    Index           detectx-events
    Suppress_Type_Name On
    tls             Off
    # En prod (plugin sécurité OpenSearch réactivé) :
    # HTTP_User     admin
    # HTTP_Passwd   <mot de passe>
    # tls           On
