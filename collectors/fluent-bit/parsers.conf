# Parsers Fluent Bit pour DeTecTX.
# Le plugin winlog fournit déjà des champs structurés ; ce fichier est présent
# pour d'éventuels journaux texte additionnels (Suricata eve.json, Zeek, ...).

[PARSER]
    Name        json
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
